- name: Basic installations for nodes
  hosts: k8nodes
  become: true
  tasks:
    - name: Remove iptables (conflicts with iptables-nft)
      pacman:
        name: iptables
        extra_args: "--cascade"
        state: absent

    - name: Install required packages
      pacman:
        name:
          - iproute2
          - iptables-nft
          - containerd
          - cni-plugins
          - kubelet
          - kubeadm
          - kube-proxy
        state: present
        update_cache: yes

    # br_netfilter and containerd
    - include_tasks: ../../tasks/setup_common.yml

    # kubelet service override
    - include_tasks: ../../tasks/kubelet_common.yml

  handlers:
    - import_tasks: ../../handlers/common.yml
